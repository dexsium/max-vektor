name: max_vektor
description: "Max Vektor — неофициальный клиент мессенджера MAX (iOS/Android)"
publish_to: 'none'
version: 0.16.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Сеть и протокол
  msgpack_dart: ^1.0.1
  http: ^1.2.2
  mime: ^2.0.0

  # Локальное хранение
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4   # для Windows/Linux/macOS desktop
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.6.1

  # UI и утилиты
  # Реальные version/build из бандла: CI подставляет номер сборки в
  # CFBundleVersion, и «О приложении» должно показывать его, а не константу.
  package_info_plus: ^8.1.2
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  # Управление кэшем изображений (раздел «Память»: размер и очистка,
  # отдельный кэш для стикеров).
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.16
  equatable: ^2.0.7
  logger: ^2.5.0
  uuid: ^4.5.1
  # Реальные поля устройства для userAgent INIT (anti-ban: правдоподобный
  # официальный отпечаток вместо урезанного «не родной клиент»).
  device_info_plus: ^11.1.0

  # Сканер QR для входа по QR-коду (op 290 AUTH_QR_APPROVE): залогиненный
  # клиент сканирует QR другого устройства и авторизует его вход.
  mobile_scanner: ^5.2.3

  # Определение типа сети (Wi-Fi/мобильная) для режима автозагрузки
  # «По Wi-Fi»: медиа стартует/грузится только на Wi-Fi.
  connectivity_plus: ^6.1.0

  # Нативный плеер видео (iOS AVPlayer / Android ExoPlayer).
  video_player: ^2.9.2

  # Проигрывание голосовых/аудио сообщений.
  audioplayers: ^6.1.0

  # Медиа (UI; реальная отправка медиа — TODO, опкоды протокола не реверснуты)
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  permission_handler: ^11.3.1

  # Адресная книга
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
